name: Probe HLTV curl_cffi
on:
  push:
    branches: [test/hltv-playwright-download]
    paths:
      - scripts/probe_hltv_curl_cffi.py
      - .github/workflows/probe-hltv-curl-cffi.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/hltv-playwright-download
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install curl_cffi
      - name: Probe
        id: probe
        continue-on-error: true
        run: python scripts/probe_hltv_curl_cffi.py
      - name: Commit result
        if: always()
        run: |
          git config user.name nadeatlas-demo-bot
          git config user.email actions@users.noreply.github.com
          git add data/probes/hltv-curl-cffi.json || true
          git commit -m "Probe HLTV with curl_cffi" || exit 0
          git pull --rebase -X theirs origin test/hltv-playwright-download || true
          git push origin HEAD:test/hltv-playwright-download || true
      - name: Mark failure
        if: steps.probe.outcome != 'success'
        run: exit 1
