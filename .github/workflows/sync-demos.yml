name: Sync verified Dust2 demos

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/**"
      - "config/**"
      - ".github/workflows/sync-demos.yml"
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: demo-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install archive tools
        run: |
          sudo apt-get update && sudo apt-get install -y p7zip-full libcairo2
          pip install pillow cairosvg
      - name: Sync
        env:
          BETTER_CS_API_KEY: ${{ secrets.BETTER_CS_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/sync.py || code=$?; if [ "${code:-0}" -ne 0 ] && [ "${code:-0}" -ne 2 ]; then exit "$code"; fi
      - name: Merge HLTV replays uploaded from the app
        run: python3 scripts/hltv_merge.py
      - name: Publish index/status changes
        run: |
          git add -A index.json index-all-maps.json status.json team_logos.json team_colors.json logos data
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "nadeatlas-demo-bot"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "Sync verified pro demos (all maps) and team logos"
          git pull --rebase -X theirs || true
          git push
