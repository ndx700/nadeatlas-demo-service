name: Probe better-cs-api docs
on: workflow_dispatch
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/probes/better_cs_docs.py
        env:
          BETTER_CS_API_KEY: ${{ secrets.BETTER_CS_API_KEY }}
      - run: |
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/probes/better-cs-api.json; git diff --cached --quiet && exit 0
          git commit -qm "probe: better-cs-api docs"
          for i in 1 2 3 4 5; do git pull -q --rebase origin main && git push -q origin HEAD:main && exit 0; sleep 5; done
