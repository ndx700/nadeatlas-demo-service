name: Probe BO3 filters
on:
  push:
    branches: [test/hltv-playwright-download]
    paths:
      - scripts/probe_bo3_filters.py
      - .github/workflows/probe-bo3-filters.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/hltv-playwright-download
      - run: python3 scripts/probe_bo3_filters.py
      - run: |
          git config user.name nadeatlas-demo-bot
          git config user.email actions@users.noreply.github.com
          git add data/probes/bo3-filters.json
          git commit -m "Probe BO3 API filters" || exit 0
          git pull --rebase -X theirs origin test/hltv-playwright-download || true
          git push origin HEAD:test/hltv-playwright-download
