name: Test BO3 direct demo download
on:
  workflow_dispatch:
  push:
    branches: [test/hltv-playwright-download]
    paths:
      - .github/workflows/test-bo3-demo-download.yml
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Resolve and download BO3 Dust2 demo
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          game_id=187819
          api=f"https://api.bo3.gg/api/v1/games/{game_id}"
          h={"User-Agent":"Mozilla/5.0","Accept":"application/json","Origin":"https://bo3.gg","Referer":"https://bo3.gg/"}
          with urllib.request.urlopen(urllib.request.Request(api,headers=h),timeout=30) as r:
              obj=json.loads(r.read().decode())
          rel=obj["demo_url"]
          url=rel if rel.startswith("http") else "https://files.bo3.gg/"+rel.lstrip("/")
          print("DEMO_URL",url)
          req=urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0","Accept":"*/*"})
          out="2026-10-06-legacy-vs-m80-dust2.dem"
          with urllib.request.urlopen(req,timeout=240) as r, open(out,"wb") as f:
              while True:
                  b=r.read(4*1024*1024)
                  if not b: break
                  f.write(b)
          size=os.path.getsize(out)
          with open(out,"rb") as f: head=f.read(16)
          print("SIZE",size,"HEAD",head)
          assert size>1_000_000
          assert head.startswith((b"PBDEMS2",b"HL2DEMO"))
          PY
      - name: Publish test demo
        run: |
          gh release view demos >/dev/null 2>&1 || gh release create demos --title "NadeAtlas verified demos" --notes "Verified CS2 professional demos."
          gh release upload demos 2026-10-06-legacy-vs-m80-dust2.dem --clobber
