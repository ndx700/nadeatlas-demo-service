name: Probe recent 5E replay endpoints
on:
  push:
    branches: [test/hltv-playwright-download]
    paths:
      - scripts/probe_5e_recent_replay.py
      - .github/workflows/probe-5e-recent-replay.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/hltv-playwright-download
      - run: python3 scripts/probe_5e_recent_replay.py
      - run: |
          git config user.name nadeatlas-demo-bot
          git config user.email actions@users.noreply.github.com
          git add data/probes/5e-recent-replay.json
          git commit -m "Probe recent 5E replay endpoints" || exit 0
          git pull --rebase -X theirs origin test/hltv-playwright-download || true
          git push origin HEAD:test/hltv-playwright-download
