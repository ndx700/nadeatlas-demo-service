name: HLTV images
# Team crests (hltv/img/teams) and player photos (hltv/img/players) from HLTV's image CDN; see scripts/hltv_images.py.
on:
  workflow_dispatch:
    inputs:
      all:
        description: Fetch every player photo again
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - 'scripts/data/hltv-image-urls.json'
      - 'scripts/hltv_images.py'
      - '.github/workflows/hltv-images.yml'
permissions:
  contents: write
concurrency: hltv-images
jobs:
  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get install -y libcairo2 >/dev/null && pip install pillow cairosvg >/dev/null
      - run: python3 scripts/hltv_images.py ${{ inputs.all && '--all' || '' }}
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A hltv/img
          git diff --cached --quiet && exit 0
          git commit -qm "hltv/img: team crests and player photos from HLTV"
          for i in 1 2 3 4 5; do git pull -q --rebase origin main && git push -q origin HEAD:main && exit 0; sleep $((i*5)); done
          exit 1
