      - '.github/probes/test-gabriel-hltv-api.sh'
      - '.github/workflows/test-gabriel-hltv-api.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: bash .github/probes/test-gabriel-hltv-api.sh
